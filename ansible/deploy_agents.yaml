---
- name: Deploy binary to Team 20 Linux hosts
  hosts: team20_linux
  become: yes
  vars:
    service_name: dchpd
    binary_source: files/client
    binary_dest: /usr/local/bin/dchpd
    service_description: "DHCP Daemon"

  tasks:
    - name: Copy Linux binary
      copy:
        src: "{{ binary_source }}"
        dest: "{{ binary_dest }}"
        mode: '0755'

    - name: Create systemd service
      copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        content: |
          [Unit]
          Description={{ service_description }}
          After=network.target

          [Service]
          ExecStart={{ binary_dest }}
          Restart=always
          RestartSec=5
          User=root

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and start service
      systemd:
        name: "{{ service_name }}"
        enabled: true
        state: restarted

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload
      become: yes
