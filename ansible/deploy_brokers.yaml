---
# ────────────────────────────────────────────────
# Team 20 Router Binary
# ────────────────────────────────────────────────
- name: Deploy binary to Team 20 router
  hosts: team20_router
  become: yes
  vars:
    service_name: dchpd-r
    binary_source: files/broker
    binary_dest: /usr/local/bin/dchpd-r
    service_description: "DHCP Daemon - Router"

  tasks:
    - name: Copy router binary
      copy:
        src: "{{ binary_source }}"
        dest: "{{ binary_dest }}"
        mode: '0755'

    - name: Create systemd service for router app
      copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        content: |
          [Unit]
          Description={{ service_description }}
          After=network.target

          [Service]
          ExecStart={{ binary_dest }}
          Restart=always
          RestartSec=5
          User=root

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and start router service
      systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload
      become: yes