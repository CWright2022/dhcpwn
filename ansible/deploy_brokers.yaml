---
- name: Deploy broker to Debian 12 host (VikingRaids)
  hosts: team20_broker
  become: yes
  vars:
    binary_source: files/broker      # Path to the binary on your control node
    binary_dest: /usr/local/bin/dchpds
    service_name: dchpds
    service_description: "dchpd service"

  tasks:
    - name: Copy special binary to Debian host
      ansible.builtin.copy:
        src: "{{ binary_source }}"
        dest: "{{ binary_dest }}"
        mode: '0755'

    - name: Create systemd unit file
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        content: |
          [Unit]
          Description={{ service_description }}
          After=network.target

          [Service]
          ExecStart={{ binary_dest }}
          Restart=always
          RestartSec=5
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload
