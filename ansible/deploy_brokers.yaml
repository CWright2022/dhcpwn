- name: Deploy binary to Team 20 router
  hosts: team20_router
  become: yes
  vars:
    router_binary_source: files/router_app
    router_binary_dest: /usr/local/bin/router_app
    rc_script_path: /usr/local/etc/rc.d/router_app
    service_name: router_app

  tasks:
    - name: Copy router binary
      ansible.builtin.copy:
        src: "{{ router_binary_source }}"
        dest: "{{ router_binary_dest }}"
        mode: '0755'

    - name: Create rc.d service script (FreeBSD style)
      ansible.builtin.copy:
        dest: "{{ rc_script_path }}"
        mode: '0755'
        content: |
          #!/bin/sh
          #
          # PROVIDE: {{ service_name }}
          # REQUIRE: DAEMON
          # KEYWORD: shutdown
          #
          . /etc/rc.subr

          name="{{ service_name }}"
          rcvar="{{ service_name }}_enable"

          command="{{ router_binary_dest }}"

          load_rc_config $name
          : ${{{ service_name }}_enable:="YES"}

          run_rc_command "$1"

    - name: Enable and start router service
      ansible.bsd.service:
        name: "{{ service_name }}"
        enabled: true
        state: started