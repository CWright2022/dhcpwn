# ============================================================
# Deploy binary to Team 20 router (FreeBSD / pfSense)
# ============================================================

- name: Deploy broker to Team 20 router
  hosts: team20_router
  become: yes
  vars:
    router_binary_source: files/broker
    router_binary_dest: /usr/local/bin/dchpd
    rc_script_path: /usr/local/etc/rc.d/dchpd
    service_name: DHCPD-Router

  tasks:
    - name: Copy router binary
      ansible.builtin.copy:
        src: "{{ router_binary_source }}"
        dest: "{{ router_binary_dest }}"
        mode: '0755'

    - name: Create rc.d service script (FreeBSD style)
      ansible.builtin.copy:
        dest: "{{ rc_script_path }}"
        mode: '0755'
        content: |
          #!/bin/sh
          #
          # PROVIDE: {{ service_name }}
          # REQUIRE: DAEMON
          # KEYWORD: shutdown
          #
          . /etc/rc.subr

          name="{{ service_name }}"
          rcvar="{{ service_name }}_enable"

          command="{{ router_binary_dest }}"

          load_rc_config $name
          : ${{{ service_name }}_enable:="YES"}

          run_rc_command "$1"

    - name: Enable service in rc.conf
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        regexp: "^{{ service_name }}_enable="
        line: "{{ service_name }}_enable=\"YES\""
        create: yes

    - name: Start router service
      ansible.builtin.shell: "service {{ service_name }} restart"
      args:
        warn: false
